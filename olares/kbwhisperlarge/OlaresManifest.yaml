olaresManifest.version: "0.11.0"
olaresManifest.type: app
apiVersion: "v2"
metadata:
  name: kbwhisperlarge
  description: Private transcription API powered by Hugging Face Whisper models.
  icon: https://huggingface.co/front/assets/huggingface_logo-noborder.svg
  appid: kbwhisperlarge
  title: KB Whisper Large
  version: "1.7.0"
  categories:
    - AI
    - Utilities
    - Developer Tools
sharedEntrances:
  - name: kbwhisperlarge
    port: 0
    host: sharedentrances-api
    title: KB Whisper Large API
    icon: https://huggingface.co/front/assets/huggingface_logo-noborder.svg
    invisible: true
    authLevel: internal
entrances:
  - name: kbwhisperlarge
    port: 8080
    host: kbwhisperlarge-svc
    title: KB Whisper Large API
    icon: https://huggingface.co/front/assets/huggingface_logo-noborder.svg
    authLevel: internal
    openMethod: window
permission:
  appData: true
  appCache: true
{{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
  userData:
    - Home
{{- end }}
spec:
  versionName: "gpu-cu128"
  fullDescription: |
    KB Whisper Large is a shared Olares transcription API. The administrator
    installs one GPU-backed service for the cluster, while each installed user
    receives a lightweight user-space API entrance that proxies to the shared
    backend.

    Access
    - User endpoint: `https://kbwhisperlarge.<OlaresID>.olares.com`
      - Use this endpoint from browsers, user tools, or workflows that need a
        normal user-space Olares route.
    - Shared endpoint: `http://kbwhisperlarge.shared.olares.com`
      - Use this internal endpoint for cluster app-to-app API calls.

    Endpoints
    - `GET /`
      - Returns service metadata and model initialization state.
    - `GET /health`
      - Returns runtime health and model loading status.
    - `GET /v1/models`
      - Returns currently loaded model ids.
    - `POST /v1/audio/transcriptions`
      - OpenAI-style transcription endpoint using multipart form-data.
      - Request fields:
        - `file` (required)
        - `model` (optional, any Whisper-compatible Hugging Face model id)
        - `language` (optional)
        - `prompt` (optional)
        - `response_format` (`json`, `verbose_json`, or `text`)
        - `temperature` (optional)
    - `POST /transcribe`
      - Simple alias that returns `{ "text": "..." }`.

    Example request
    - `curl -X POST https://kbwhisperlarge.<OlaresID>.olares.com/v1/audio/transcriptions -F "model=openai/whisper-large-v3" -F "file=@./sample.wav" -F "language=en"`

    Notes
    - First request for each model may be slow while model weights are pulled into app data.
    - If `model` is omitted, default model `WHISPER_MODEL_ID` is used.
    - Active models are cached in-memory with LRU eviction (size configured by `WHISPER_MAX_MODELS_IN_MEMORY`).
    - Hugging Face cache is persisted in the administrator shared service app data.
    - This package targets `amd64` Olares nodes with NVIDIA GPU support.
  developer: progress44
  website: https://huggingface.co/KBLab/kb-whisper-large
  sourceCode: https://github.com/progress44/rpi-system
  submitter: progress44
  doc: https://huggingface.co/KBLab/kb-whisper-large
  license:
    - text: Apache-2.0
      url: https://huggingface.co/KBLab/kb-whisper-large
  locale:
    - en-US
  {{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
  requiredMemory: 12Gi
  limitedMemory: 12Gi
  requiredDisk: 5Gi
  limitedDisk: 40Gi
  requiredCpu: 4
  limitedCpu: 4
  requiredGpu: 12Gi
  limitedGpu: 16Gi
  {{- else }}
  requiredMemory: 64Mi
  limitedMemory: 256Mi
  requiredDisk: 1Mi
  limitedDisk: 100Mi
  requiredCpu: 10m
  limitedCpu: 100m
  {{- end }}
  supportArch:
    - amd64
  subCharts:
    - name: kbwhisperlargeserver
      shared: true
    - name: kbwhisperlarge
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: ">=1.12.3-0"
  {{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
  {{- else }}
    - name: kbwhisperlarge
      type: application
      version: ">=1.3.0"
      mandatory: true
  {{- end }}
  appScope:
  {{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
    clusterScoped: true
    appRef:
      - kbwhisperlarge
  {{- else }}
    clusterScoped: false
  {{- end }}
{{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
envs:
  - envName: OLARES_USER_HUGGINGFACE_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: OLARES_USER_HUGGINGFACE_SERVICE
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
{{- end }}
